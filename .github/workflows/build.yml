name: APK yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Server manzili (masalan http://100.x.x.x:8020/)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle wrapper jar repozitoriyda yo'q, shuning uchun Gradle to'g'ridan-to'g'ri
      # o'rnatiladi. Bu binary faylni git ga qo'shmaslik imkonini beradi.
      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Server manzilini aniqlash
        id: api
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.API_BASE_URL }}"; fi
          if [ -z "$URL" ]; then URL="http://192.168.1.50:8020/"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Ishlatiladigan API manzili: $URL"

      # Imzo kaliti ixtiyoriy. Secrets bo'lmasa debug imzo ishlatiladi —
      # pilot uchun bu yetarli, faqat har safar yangi kalit chiqmasligi uchun
      # kalitni bir marta yaratib secrets ga qo'yish tavsiya etiladi.
      - name: Imzo kalitini tayyorlash
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release kaliti bilan imzolanadi"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Kalit topilmadi — debug imzo ishlatiladi"
          fi

      - name: APK yig'ish
        run: gradle assembleRelease -PapiBaseUrl="${{ steps.api.outputs.url }}" --no-daemon --stacktrace

      - name: APK nomini o'zgartirish
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" "out/FaolMFY-v${{ github.run_number }}.apk"
          ls -lh out/

      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: FaolMFY-apk
          path: out/*.apk
          retention-days: 90

      # Teg qo'yilganda avtomatik release yaratiladi —
      # xodimlarga havola tarqatish uchun qulay
      - name: Release yaratish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            «Faol MFY» ${{ github.ref_name }}

            Server: ${{ steps.api.outputs.url }}
            Imzo: ${{ steps.sign.outputs.signed == 'true' && 'release' || 'debug' }}

            O'rnatish: APK ni telefonga yuklab, "Noma'lum manbalardan
            o'rnatish" ga ruxsat bering.
